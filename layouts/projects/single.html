{{ define "main" }}
  <section class="section content-section single-section project-single">
    <p class="eyebrow">// cat projects/{{ .File.BaseFileName }}.md</p>
    <h1 class="section-title">{{ .Title }}</h1>
    <div class="tag-row">
      {{ range .Params.tags }}<span class="tag">{{ . }}</span>{{ end }}
    </div>

    <div class="project-layout">
      {{ if .TableOfContents }}
      <aside class="project-toc">
        <p class="toc-label">// contents</p>
        {{ .TableOfContents }}
      </aside>
      {{ end }}

      <div class="project-content prose">
        {{ .Content }}
      </div>
    </div>

    <div class="contact-block">
      <a class="term-btn" href="{{ .Params.repo }}" target="_blank" rel="noopener">$ open repo →</a>
      <a class="term-btn" href="{{ "/projects/" | relURL }}">$ cd ..</a>
    </div>
  </section>
{{ end }}
