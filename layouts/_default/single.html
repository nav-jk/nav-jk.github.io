{{ define "main" }}
  <section class="section content-section single-section">
    <p class="eyebrow">// cat {{ .Section | default "page" }}.md</p>
    <h2 class="section-title">{{ .Title }}</h2>
    <div class="prose">
      {{ .Content }}
    </div>

    {{ if eq .Section "about" }}
    <div class="skills-grid">
      {{ range .Site.Data.skills }}
      <span class="skill-chip">{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}

    {{ if eq .Section "contact" }}
    <div class="contact-block">
      <a class="term-btn" href="mailto:{{ .Site.Params.email }}">$ mail {{ .Site.Params.email }}</a>
      <a class="term-btn" href="{{ .Site.Params.github }}" target="_blank" rel="noopener">$ open github</a>
      <a class="term-btn" href="{{ .Site.Params.linkedin }}" target="_blank" rel="noopener">$ open linkedin</a>
    </div>
    {{ end }}
  </section>
{{ end }}
